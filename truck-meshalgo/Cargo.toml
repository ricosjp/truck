[package]
name = "truck-meshalgo"
version = "0.4.0"
edition = "2021"
description = "Mesh algorigthms, include tessellations of the shape."
homepage = "https://github.com/ricosjp/truck"
repository = "https://github.com/ricosjp/truck"
license = "Apache-2.0"

keywords = ["truck", "graphics", "mesh"]
categories = ["graphics"]

[features]
analyzers = []
filters = []
tessellation = ["spade", "filters"]
vtk = ["vtkio"]
gpu = ["dep:truck-platform", "dep:bytemuck", "dep:pollster"]
cuda = []
default = ["analyzers", "filters", "tessellation", "vtk", "gpu"]

[build-dependencies]
cc = "1.10.0"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
derive_more = { version = "2.1.1", features = ["full"] }
pollster = { version = "1.0.1", optional = true }
rustc-hash = "2.1.3"
array-macro = "2.1.8"
itertools = "0.15.0"
spade = { version = "2.15.1", optional = true }
truck-base = { version = "0.5.0", path = "../truck-base" }
truck-geometry = { version = "0.5.0", path = "../truck-geometry" }
truck-platform = { version = "0.6.0", path = "../truck-platform", optional = true }
truck-polymesh = { version = "0.6.0", path = "../truck-polymesh" }
truck-topology = { version = "0.6.0", path = "../truck-topology" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12.0"
vtkio = { version = "0.6.3", default-features = false, features = ["xml"], optional = true }

[dev-dependencies]
rand = "0.10.3"
serde_json = "1.0.154"
proptest = { version = "1.12.0", features = ["attr-macro"] }
truck-modeling = { version = "0.6.0", path = "../truck-modeling" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[[bench]]
name = "cpu_vs_gpu"
harness = false
